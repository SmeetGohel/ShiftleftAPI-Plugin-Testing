# Generated by Shift-Left Studio. Commit this as .github/workflows/shift-left-studio.yml
name: API tests (Shift-Left Studio)
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Download the runner and check it
        run: curl --fail --silent --show-error --location --proto "=https" --output sls-runner.js "$SLS_RUNNER_URL" || { echo "The runner file could not be downloaded, so the build stops here." >&2; exit 1; } && echo "$SLS_RUNNER_SHA256  sls-runner.js" | sha256sum --check --strict - || { echo "The runner file does not match its SHA-256 checksum, so it was not run." >&2; exit 1; }
        env:
          SLS_RUNNER_URL: "https://totalshiftleft.blob.core.windows.net/engine-staging/2.0.96.266/sls-runner-2.0.96.266.js"
          SLS_RUNNER_SHA256: "ec1efffa8e90433da9c4adc55349129a78da804e9d7e42f99fb183fc30612ebf"
      - name: Run the test pack
        run: node sls-runner.js --url "$SLS_URL" --token "$SLS_TOKEN" --pack "$SLS_PACK" --junit results.xml --min-pass-rate 0.9
        env:
          SLS_URL: "https://localhost:5001"
          SLS_PACK: "96694579-0698-46ca-b6ba-633c687b7b76"
          SLS_TOKEN: ${{ secrets.SLS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: results.xml }
