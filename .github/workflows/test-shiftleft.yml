# Generated by Shift-Left Studio. Commit this as .github/workflows/shift-left-studio.yml
name: API tests (Shift-Left Studio)
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run the test pack
        run: node backend/scripts/run-pack-cli.js --url "$SLS_URL" --token "$SLS_TOKEN" --pack "$SLS_PACK" --junit results.xml --min-pass-rate 0.9
        env:
          SLS_URL: "https://app.totalshiftleft.ai"
          SLS_PACK: "60774ede-0b64-4355-a371-5083111bd776"
          SLS_TOKEN: ${{ secrets.SLS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: results.xml }
